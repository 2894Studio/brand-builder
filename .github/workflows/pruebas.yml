name: Pruebas

# Autotests del plugin en Linux, macOS y Windows.
# Sin PYTHONUTF8 a propósito: así se ven los fallos de codificación que tendría una persona real en Windows.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  autotests:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Dependencias de Python
        run: python -m pip install --quiet pyyaml
      - name: Compilar los scripts
        run: python -m compileall -q skills evals
      - name: Skills (YAML estricto)
        run: python skills/brand-kit-builder/tools/verificar_skills.py
      - name: Estrategia (verificador del brief)
        run: python skills/estrategia/tools/verificar_estrategia.py
